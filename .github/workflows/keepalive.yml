name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: curl -fsS -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" https://scandoc-api.onrender.com/
