services:
  - type: web
    name: scandoc-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://scandoc-f29de.web.app,https://scandoc.qaoverflow.com
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: APP_BASE_URL
        value: https://scandoc-f29de.web.app
      - key: STRIPE_PRICE_BASICO
        sync: false
      - key: STRIPE_PRICE_PROFISSIONAL
        sync: false
      - key: STRIPE_PRICE_AVANCADO
        sync: false
      - key: STRIPE_PRICE_ILIMITADO
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
